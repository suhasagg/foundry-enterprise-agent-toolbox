[project]
name="foundry-enterprise-agent-toolbox"
version="1.0.0"
requires-python=">=3.11"
dependencies=[
 "fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3",
 "pydantic-settings>=2.4,<3","httpx>=0.27,<1","redis>=5,<6",
 "sqlalchemy>=2.0,<3","asyncpg>=0.29,<1","langgraph>=0.2,<1",
 "langchain-core>=0.3,<1","azure-identity>=1.17,<2",
 "prometheus-client>=0.20,<1","structlog>=24,<26","tenacity>=9,<10",
 "PyJWT>=2.9,<3","jsonschema>=4.23,<5"
]
[project.optional-dependencies]
foundry=[
 "agent-framework>=1.0.0b1",
 "agent-framework-foundry-hosting>=1.0.0b1",
 "langchain-azure-ai[hosting]>=1.2.9"
]
dev=["pytest>=8,<9","pytest-asyncio>=0.24,<1","ruff>=0.6,<1"]
[tool.pytest.ini_options]
pythonpath=["."]
asyncio_mode="auto"
